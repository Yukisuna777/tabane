name: release

# タグ v* を push すると arm64 の .dmg/.zip をビルドして GitHub Release に添付し、
# （トークンがあれば）自分の homebrew-tap の Cask も更新する。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    # macos-14 は Apple Silicon ランナー（arm64 ビルド用）
    runs-on: macos-14
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.meta.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build distributables
        env:
          # 署名しない（identity: null）。electron-builder の署名探索も止める。
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Collect metadata
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="dist/tabane-${version}-arm64.zip"
          sha=$(shasum -a 256 "$zip" | awk '{print $1}')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### tabane $version"
            echo "zip sha256: \`$sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tabane-*-arm64.dmg
            dist/tabane-*-arm64.zip
          generate_release_notes: true
          body: |
            ## インストール

            Homebrew:
            ```bash
            brew install --cask yukisuna777/tap/tabane
            ```

            もしくは:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/Yukisuna777/tabane/main/install.sh | bash
            ```

            zip sha256: `${{ steps.meta.outputs.sha256 }}`

  bump-tap:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Homebrew tap cask
        env:
          # homebrew-tap リポへ push できる PAT（repo スコープ）。未設定なら黙ってスキップ。
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN 未設定のため tap 更新をスキップ（初回は手動で追加）"
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Yukisuna777/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/__VERSION__/${VERSION}/g" -e "s/__SHA256__/${SHA256}/g" \
            packaging/homebrew/tabane.rb.tpl > tap/Casks/tabane.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tabane.rb
          git commit -m "tabane ${VERSION}" || { echo "変更なし"; exit 0; }
          git push
